
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#030B1F">
  <meta name="description" content="My Social Hub — all your favorite socials in one cosmic place.">
  <title>My Social Hub ✦</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <style>
    :root {
      --bg: #030B1F;
      --panel: #0A1A3A;
      --violet: #4C3BFF;
      --purple: #8A5CFF;
      --moon: #C7D3FF;
      --white: #F5F6FF;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--white);
      font-family: system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(ellipse at 15% 5%, #2935a844, transparent 38%),
        radial-gradient(ellipse at 90% 40%, #7c3cff25, transparent 35%),
        radial-gradient(ellipse at 45% 100%, #164e9a35, transparent 40%),
        var(--bg);
      overflow-x: hidden;
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .55;
      background-image:
        radial-gradient(2px 2px at 20% 30%, #fff 50%, transparent),
        radial-gradient(1px 1px at 75% 20%, #c7d3ff 50%, transparent),
        radial-gradient(2px 2px at 60% 70%, #fff 50%, transparent),
        radial-gradient(1px 1px at 90% 85%, #b7a6ff 50%, transparent),
        radial-gradient(1px 1px at 12% 80%, #fff 50%, transparent);
      background-size: 240px 240px;
      animation: twinkle 5s ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      from { opacity: .25; }
      to { opacity: .7; }
    }

    .wrap {
      position: relative;
      width: min(100% - 32px, 540px);
      margin: auto;
      padding: 35px 0 45px;
    }

    header { text-align: center; margin-bottom: 26px; }

    .butterfly {
      display: inline-block;
      font-size: 54px;
      filter: drop-shadow(0 0 18px #8a5cffaa);
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-8px) rotate(4deg); }
    }

    h1 {
      margin: 10px 0 8px;
      font-size: clamp(28px, 7vw, 38px);
      letter-spacing: 1px;
      background: linear-gradient(100deg, #fff, #c7d3ff, #a68aff);
      color: transparent;
      background-clip: text;
      -webkit-background-clip: text;
    }

    .subtitle { color: var(--moon); font-size: 14px; }
    .motto { color: #a9a9ff; font-size: 12px; letter-spacing: 2px; margin-top: 14px; }

    .section-title {
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--moon);
      margin: 28px 0 13px;
    }

    .social-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .social {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px 12px;
      color: var(--white);
      text-decoration: none;
      border: 1px solid #8274ff45;
      border-radius: 17px;
      background: linear-gradient(135deg, #102348dd, #101432ee);
      box-shadow: inset 0 1px #ffffff0b, 0 7px 22px #00000020;
      transition: transform .2s, border-color .2s, box-shadow .2s;
      animation: appear .5s both;
    }

    .social:active { transform: scale(.97); }
    .social:hover {
      transform: translateY(-3px);
      border-color: var(--purple);
      box-shadow: 0 0 20px #684aff35;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .social-icon {
      flex: 0 0 43px;
      height: 43px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: linear-gradient(145deg, #4c3bff55, #8a5cff22);
      border: 1px solid #a49aff33;
      font-size: 22px;
    }

    .social-name { font-size: 14px; font-weight: 650; }
    .social-note { color: #aebde6; font-size: 11px; margin-top: 3px; }

    button {
      font: inherit;
      cursor: pointer;
      color: white;
      border: 1px solid #a79aff65;
      border-radius: 13px;
      padding: 12px 16px;
      background: linear-gradient(110deg, #4433df, #8051dc);
      box-shadow: 0 0 18px #6545ff2b;
    }

    .edit-button { width: 100%; margin-top: 20px; }
    .secondary {
      background: #101e40;
      box-shadow: none;
    }

    .footer {
      text-align: center;
      color: #aab8df;
      font-size: 12px;
      margin-top: 28px;
    }

    dialog {
      width: min(92%, 460px);
      max-height: 85vh;
      overflow-y: auto;
      color: var(--white);
      background: #08152e;
      border: 1px solid #7d69ff80;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 0 50px #000b;
    }

    dialog::backdrop { background: #010511c9; }
    dialog h2 { margin-top: 0; }

    .field { display: block; margin: 15px 0; }
    .field span { display: block; font-size: 13px; margin-bottom: 7px; }
    .field input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #6574a8;
      color: white;
      background: #030b1f;
      font-size: 14px;
    }

    .actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 20px; }
    .actions button { flex: 1; }

    @media (max-width: 350px) {
      .social-grid { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>

  <main class="wrap">
    <header>
      <div class="butterfly" aria-hidden="true">🦋</div>
      <h1>My Social Hub</h1>
      <div class="subtitle">Your universe, all in one place ✦</div>
      <div class="motto">MIDNIGHT BLUE · COSMIC SOUL</div>
    </header>

    <div class="section-title">✦ EXPLORE MY UNIVERSE</div>
    <section class="social-grid" id="socialGrid" aria-label="Social media links"></section>

    <button class="edit-button" id="editButton" type="button">✦ Edit My Links</button>
    <div class="footer">Made of stardust and a little mystery 💜</div>
  </main>

  <dialog id="editDialog">
    <h2>✦ Edit My Links</h2>
    <p class="subtitle">Paste your profile URL for each platform.</p>
    <form id="linksForm">
      <div id="linkFields"></div>
      <div class="actions">
        <button type="submit">Save Links</button>
        <button class="secondary" id="cancelButton" type="button">Cancel</button>
      </div>
    </form>
  </dialog>

  <script>
    const platforms = [
      { id: "facebook", name: "Facebook", icon: "📘" },
      { id: "messenger", name: "Messenger", icon: "💬" },
      { id: "tiktok", name: "TikTok", icon: "🎵" },
      { id: "instagram", name: "Instagram", icon: "📸" },
      { id: "x", name: "X", icon: "𝕏" },
      { id: "youtube", name: "YouTube", icon: "▶️" },
      { id: "threads", name: "Threads", icon: "🧵" },
      { id: "pinterest", name: "Pinterest", icon: "📌" }
    ];

    const storageKey = "mySocialHubLinksV2";
    const grid = document.getElementById("socialGrid");
    const dialog = document.getElementById("editDialog");
    const fields = document.getElementById("linkFields");

    function loadLinks() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || "{}");
        return Object.fromEntries(
          platforms.map(p => [p.id, typeof saved[p.id] === "string" ? saved[p.id] : ""])
        );
      } catch {
        return Object.fromEntries(platforms.map(p => [p.id, ""]));
      }
    }

    let links = loadLinks();

    function validUrl(value) {
      try {
        const url = new URL(value);
        return url.protocol === "https:" || url.protocol === "http:";
      } catch {
        return false;
      }
    }

    function renderLinks() {
      grid.replaceChildren();

      platforms.forEach((p, index) => {
        const url = links[p.id];
        const a = document.createElement("a");
        a.className = "social";
        a.style.animationDelay = `${index * 45}ms`;
        a.href = validUrl(url) ? url : "#";
        a.setAttribute("aria-label", p.name);

        const icon = document.createElement("span");
        icon.className = "social-icon";
        icon.textContent = p.icon;

        const info = document.createElement("span");
        const name = document.createElement("div");
        name.className = "social-name";
        name.textContent = p.name;

        const note = document.createElement("div");
        note.className = "social-note";
        note.textContent = validUrl(url) ? "Open profile ↗" : "Tap Edit My Links";

        info.append(name, note);
        a.append(icon, info);

        a.addEventListener("click", event => {
          if (!validUrl(links[p.id])) {
            event.preventDefault();
            openEditor();
          } else {
            a.target = "_blank";
            a.rel = "noopener noreferrer";
          }
        });

        grid.append(a);
      });
    }

    function openEditor() {
      fields.replaceChildren();

      platforms.forEach(p => {
        const label = document.createElement("label");
        label.className = "field";

        const title = document.createElement("span");
        title.textContent = `${p.icon} ${p.name}`;

        const input = document.createElement("input");
        input.type = "url";
        input.inputMode = "url";
        input.autocomplete = "url";
        input.placeholder = "https://...";
        input.value = links[p.id];
        input.name = p.id;
        input.setAttribute("aria-label", `${p.name} profile URL`);

        label.append(title, input);
        fields.append(label);
      });

      if (!dialog.open) dialog.showModal();
    }

    document.getElementById("editButton").addEventListener("click", openEditor);
    document.getElementById("cancelButton").addEventListener("click", () => dialog.close());

    document.getElementById("linksForm").addEventListener("submit", event => {
      event.preventDefault();
      const formData = new FormData(event.currentTarget);
      const updated = {};

      for (const p of platforms) {
        const value = String(formData.get(p.id) || "").trim();
        if (value && !validUrl(value)) {
          alert(`Please enter a valid http:// or https:// URL for ${p.name}.`);
          return;
        }
        updated[p.id] = value;
      }

      try {
        localStorage.setItem(storageKey, JSON.stringify(updated));
        links = updated;
        renderLinks();
        dialog.close();
      } catch {
        alert("Your browser could not save the links. Please check your browser settings.");
      }
    });

    renderLinks();

    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
